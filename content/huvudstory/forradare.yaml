# Förrädare: intern källista
# Inte synlig för gäster. Nycklar = guests.login_slug.
# Kommentarer: Piratnamn och skuta, så agenten slipper slå i cast.md.
#
# type: mole = A är mullvad på home, B är kontakt på works_for
# Cirkel två steg (inte skattcirkeln 1→2→3→4→5→1):
#   1 → 3 → 5 → 2 → 4 → 1
#
# Regler:
#   * exakt en mullvad och exakt en kontakt per skuta, olika personer
#   * en person är mullvad, kontakt, eller ingen av delarna. Inte båda.
#   * bara attending = true
#   * kontakt får inte vara mullvadens fiende (fiender.yaml)
#   * bygg på romans när cirkeln tillåter (romanser.yaml)
#   * mullvaden ska vilja något av uppdragsgivaren, inte bara "var förrädare"
#   * drivkraften ska stå i förrädarstycket hos både A och B. Inte bara i en
#     senare romans- eller sidosektion. Romans när cirkeln tillåter: gör den
#     tydlig redan där. Inte romans: säg den andra drivkraften (titel, skuld).
#   * inte mullvad: malintadaa, gustaftadaa, josefinlowing, viktoransund,
#     fabianmacklin, jesperlejfjord
#   * inte kontakt: gustaftadaa. malintadaa default inte (stjäl från antagonisten)
#   * Undantag 2026-09-03: josefinlowing (Kuling) är kontakt för Babord (forradare 5).
#     Hon får fortfarande inte vara mullvad. Båtarna gör kontakt OK.
#
# Löjtnant Spader (`gustaftadaa`) är fullt spelbar: sidequests, romanser,
# rivaliteter som vilken gäst som helst. Han lämnar spelledningen. Undantag:
# inte mullvad, inte kontakt. **Undantag 2026-09-03:** han bär Q-3-start
# (Dövers återbud). I övrigt inga ledtrådar till huvudquesten.
#
# Kunskap: bara A och B vet att mullvaden finns och vem det är.
# Inte hemmalaget, inte resten av uppdragsgivarens lag.
#
# status: pending | done | skipped
# done = brödtext skriven i guests/. Inte i lagfilen.
# Gästfilerna är nollställda 2026-08-23. Inga done förrän gästtexten skrivs.
# 2026-08-24: home 2 och 3 omslumpade. Läs inte upp a för Gustaf.

