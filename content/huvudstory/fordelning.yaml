# Fördelning: huvudstory ut till deltagarnas intrigfiler
#
# Intern. Inte gästtext. Bryggan mellan design i content/huvudstory/
# och gästtexten i content/intriger/{crews,guests}/.
#
# Arbetsordning:
#   1. Story-bit beslutas i akter.md eller sidequests.md
#   2. Posten läggs in här med status: pending
#   3. Gästtext skrivs i content/intriger/guests/{slug}.md eller crews/{id}.md
#      enligt content/intriger/STYLE.md
#   4. status: done
#
# Ingen gästtext skrivs innan posten finns här. Se README.md.
# Gästfilerna är nollställda 2026-08-23. Individposter är pending
# tills den omgången. Crew-poster (id 1–5) är skrivna i crews/.
#
# Fält:
#   id            löpnummer
#   beat          B-nn i akter.md, eller S-nn i sidequests.md
#   akt           I | II | III | IV
#   till          lista av login_slug, eller mappningen { crew: N }
#   roll          barare | jagare | grindvakt | vittne   (se premiss.md)
#   vet           vad personen faktiskt vet efter att ha läst sin intrig.
#                 Quest-start: bara första ledtråden, inte kapitlet.
#                 Se quests.md, "Ingångstext". Per quest: quests/Q-n.md.
#   vet_inte      vad personen uttryckligen inte får veta
#   speglas       slugs som behöver motsvarande text för att världen ska hålla
#   bygger_pa     romans: N eller fiende: N ur romanser.yaml / fiender.yaml
#   pussel        Q-n i quests/Q-n.md när mekaniken är tillsatt, eller null. Lediga byggstenar i pussel.md.
#   status        pending | done | skipped
#
# Questposter (när Q-1 till Q-5 är färdigskrivna, story plus uppgifter):
#   En start per quest, i en spelares intrig, inte i lagfilen.
#   Starten är första ledtråden: ett skäl att vilja, en konkret nästa handling.
#   Inte kapitlet. Cirkulerande version utöver starten sitter i props och pit stops.
#   Tvärledtråd: slug på en skuta som *inte* har ingången. vet: info som
#   bara är meningsfull om mottagaren redan känner till questet.
#   Varje skuta: exakt tre starter (olika quests). Varje quest: exakt tre skutor.
#   Välj lag och deltagare utifrån storyn. Inte tvärtom. Inte förrän då.
#
# Kontroller att köra på hela filen innan skrivning börjar:
#   * har varje av de 25 slugsen minst en post?
#   * ligger alla toppar inte i samma akt?
#   * har någon fler än tre poster? (risk för överlastning)
#   * motsäger någon post en annan?
#   * finns någon post där två personer måste vara på olika platser samtidigt?
#   * varje skuta: exakt tre quest-starter, olika Q-n
#   * varje quest: exakt tre skutor
#   * tvärledtrådar bara till de två quests skutan saknar, och meningslösa utan questet
#   * gustaftadaa (Löjtnant Spader) får inte quest-starter eller tvärledtrådar
#     till huvudquesten. I övrigt fullt spelbar. Inte mullvad, inte kontakt.

