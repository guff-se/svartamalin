# Romanser / kärleksaffärer: intern källista
# Inte synlig för gäster. Nycklar = guests.login_slug.
# Skriv `Piratnamn (civilnamn)` i kommentarer så agenten slipper slå i cast.md.

# type: mutual  = A + B (ömsesidig affär)
# type: one_way = A -> B (A har/haft känslor eller affär riktad mot B; speglas inte automatiskt)
# type: npc     = A med en figur som inte är gäst (ingen guests/{slug}.md)
#
# status: pending | done | skipped
# done = brödtext skriven i guests/. Inte förrän den omgången.
# Gästfilerna är nollställda 2026-08-20. Inga done förrän gästtexten skrivs.
#
# Svarta Malin får ha flera romanser samtidigt. De krockar gärna i spelet.
#
# Alla gäster skall ha minst en romans. Att vara målet för en one_way räknas inte.
#
# Rollönskemål som styrt omparningen (content/roller/):
#   * viktoransund: förbjuden kärlek med Kapten Frodig (josefinansund), inte Mini
#   * elinamelakoski: enda trygga personen är Kapten Hjärter; inget publikt par med annan
#   * jesperlejfjord: vill spela mot Katten Felix (hålls i #17/#18, inte som publikt par)
#   * amandamungsgard: något med Ludvig (#19); ingenting med Mini; inte högintensivt centrum-drama
#   * minimacklin: oläkt kärlek/svek med Svarta Malin (#20). 1 min förstummad av Malins ögon;
#     samma tapp för skeppskatt (Felix) — inte par och inte fiende med Felix
#   * edvinthungren: manschettknappar med enhörningar, fått för kärlekens skull → #3
#   * navidmodiri: nemesis är Kapten Hjärter (fiende 23, inte romans)
#   * josefinlowing: onåd från Rödskägg, bakhåll på Paradisets ö (fiende 25)
#   * elinmartensson: Prygel vill krossa hornet (fiende 24)
#   * amaliawahlstrom: saknade romans (var bara fiende 2 mot Malin), ny mutual med hampuslindblad (#23).
#     Gör henne till rival med louisevonbahr i fiender.yaml, samma Hampus.
#   * ludvigvonbahr: utöver Kosing (#19) även ny mutual med Malin (#24), gömma/krock för B-13
#   * chriskummelstedt tackade nej: inga poster

