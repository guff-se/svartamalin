# Ärkefiender: intern källista
# Inte synlig för gäster. Nycklar = guests.login_slug.
# Kommentarer: Piratnamn och skuta, så agenten slipper slå i cast.md.
#
# Regler (vid generering / ändring):
#   * alla lagmedlemmar ska ha någon att hata (outbound)
#   * majoriteten av posterna ska vara mutual
#   * fienden får inte vara i samma lag
#   * fienden får inte vara en romans (se romanser.yaml)
#   * om din romans har en romans med någon annan → den personen är gärna din fiende
#   * type mutual = ömsesidigt hat; one_way = A hatar B (B speglar inte automatiskt)
#   * one_way-mål som saknar egen fiende behöver outbound (mutual eller one_way)
#   * flera kan hata samma person av olika skäl
#   * intrigtext skrivs för BÅDA parter (även one_way: den hatade vet om hatet och varför)
#   * amandamungsgard vill inte spela personligen mot Mini: inga poster Mini–Kosing
#   * amandamungsgard vill inte stå i centrum i högintensivt drama (kidnappning etc.): #17 låg intensitet
#   * navidmodiri: nemesis Kapten Hjärter (#23). Tjuvlyssnar, fejkdöv
#   * edvinthungren: vill vara snäll nu; gamla oförrätter är röta från före omvändelsen
#   * josefinlowing: bakhåll mot Rödskägg på Paradisets ö (#25). De har båtarna tillsammans: scener vid kajen
#   * elinmartensson: Prygel vill krossa kåthornet (#24)
#   * minimacklin blir mjuk 1 min av skeppskatt (katmynta, varken tax eller treasure): inte en fiendepost
#   * elinamelakoski tackade nej 2026-08-23: inga poster
#   * amaliawahlstrom tackade nej 2026-08-27: #26 struken. #2 flyttad till elinmartensson.
#   * ludvigvonbahr tackade nej 2026-09-01: #20 struken. S-05 utan hamnskämt.
#
# status: pending | done | skipped
# done = brödtext skriven i guests/. Inte förrän den omgången.
# Gästfilerna är nollställda 2026-08-23. Inga done förrän gästtexten skrivs.

fiender:
  # --- Mutual ---

  - id: 1
    type: mutual
    a: johannabergman     # Kapten Klöver: Barken Bortförklaringen
    b: minervalowgren     # Kapten Prygel: Fregatten Fromheten
    # oförrätt: Prygel stal valsen med Hurring + äran för gemensam bordning; Klöver svarade med rykten
    status: done

  - id: 2
    type: mutual
    a: malintadaa         # Svarta Malin: Korvetten Kurtisanen
    b: elinmartensson     # Kapten Plåthorn: Galeonen Gnället
    # oförrätt: Malins skål, hon kallade Plåthorn “en fasa till kapten”; Malin kapade hennes jolle i dimman
    # Flyttad från amaliawahlstrom (Enben) 2026-08-27, återbud.
    status: done

  - id: 3
    type: mutual
    a: petterwallberg     # Kapten Lösskägg: Korvetten Kurtisanen
    b: viktoransund       # Kapten Rödskägg: Fregatten Fromheten
    # oförrätt: Lösskägg samlar skägg och har redan siktet på Rödskäggs. Rödskägg, stolt och lättkränkt, tar det som krig om Skäggens Konung.
    # Del av skäggtrion med Blåskägg (#18, #19). Ingen förhandskröning, ingen skamrand, ingen förhandsfärgning.
    status: done

  - id: 4
    type: mutual
    a: minimacklin        # Kapten Blodig: Fregatten Fördärvet
    b: josefinansund      # Kapten Frodig: Barken Bortförklaringen
    # oförrätt: Blodig hade prejat, seglen strukna, lasten hennes. Frodig stal
    # lasten och seglade in som segrare. Blodig tryckte en blodig hand i
    # Frodigs storsegel. Inte "kapitulation" (en handling, inte ett föremål).
    # Inte Blodigs eget segel.
    # Behålls: hot mot Rödskägg–Frodigs hemliga kärlek (#8) om Blodig nystar.
    status: done

  - id: 5
    type: mutual
    a: louisevonbahr      # Kapten Fuling: Fregatten Fördärvet
    b: linneaappert       # Kapten Planka: Korvetten Kurtisanen
    # oförrätt: Planka smorde Fuling med sirenolja vid förra kaptensskålen.
    # Okontrollerad lust. Fuling kastade sig på Kapten Rosing. Rosing skrattade.
    # Förnedringen Fuling skyller Planka för. Ingen feber. Ingen täckhistoria.
    # Helgen: Planka gör om det vid honnörsbordet. Fuling vill åt flaskan.
    # Rosing är vittne (den Fuling landade på), inte part i fiendskapet.
    # Inte S-04: Klöver säljer Fulings angiveri av Hurring utan att blanda in skålen.
    # Inte samma som romans 25: Fuling vet inte att Planka tar Blåskägg.
    status: done

  - id: 6
    type: mutual
    a: navidmodiri        # Kapten Döver: Fregatten Fördärvet
    b: edvinthungren      # Kapten Rötägg: Galeonen Gnället
    # oförrätt: Rötägg lastade Dövers skepp med tunnor mat som redan stank, räknade med
    # att den "döve" inte skulle höra klagomålen i tid. Döver hörde, teg för att dövheten
    # skulle hålla. Nu vill Rötägg vara snäll vid workshopen; Döver köper det inte.
    status: done

  - id: 7
    type: mutual
    a: josefinlowing      # Kapten Kuling: Fregatten Fördärvet
    b: elinmartensson     # Kapten Plåthorn: Galeonen Gnället
    # oförrätt: Under en bordning låg Kuling hukad bakom en tunna, väntade på hugg.
    # Plåthorn blåste i kåthornet och skrek att det var en varning. Stöten sålde gömman.
    # Kuling togs på bar gärning med näsan i nacken på den hon skulle ha stuckit.
    # Plåthorn smet. Kuling hånade kåthornet i skål.
    status: done

  - id: 8
    type: mutual
    a: jesperlindmarker   # Kapten Hurring: Korvetten Kurtisanen
    b: hampuslindblad     # Kapten Blåskägg: Barken Bortförklaringen
    # oförrätt: Hurring obetald skuld + skämt; Blåskägg naglade IOU:er i masten
    status: done

  - id: 20
    type: mutual
    a: ludvigvonbahr      # Kapten Dunka: Galeonen Gnället, återbud 2026-09-01
    b: fabianmacklin      # Kapten Nykter: Barken Bortförklaringen
    # Struken. Hamnskämt om svärdet. Ludvig attending=false. Nykter bär S-05 som skattepliktig (släktens rike), inte som jägare.
    status: skipped

  # --- One-way ---

  - id: 10
