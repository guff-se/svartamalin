# Ärkefiender: källista för intrigskrivning
# Inte synlig för gäster. Nycklar = guests.login_slug.
#
# Regler (vid generering / ändring):
#   * alla lagmedlemmar ska ha någon att hata (outbound)
#   * majoriteten av posterna ska vara mutual
#   * fienden får inte vara i samma lag
#   * fienden får inte vara en romans (se romanser.yaml)
#   * om din romans har en romans med någon annan → den personen är gärna din fiende
#   * type mutual = ömsesidigt hat; one_way = A hatar B (B speglar inte automatiskt)
#   * one_way-mål som saknar egen fiende behöver outbound (mutual eller one_way)
#   * flera kan hata samma person av olika skäl
#   * intrigtext skrivs för BÅDA parter (även one_way: den hatade vet om hatet och varför)
#
# status: pending | done | skipped

