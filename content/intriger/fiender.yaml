    # Låg intensitet: Kosing vill inte stå i centrum i publikt drama.
    status: done

  - id: 21
    type: mutual
    a: jesperlejfjord     # Kapten Hjärter: Fregatten Fromheten
    b: minimacklin        # Kapten Blodig: Fregatten Fördärvet
