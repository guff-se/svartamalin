    a: fabianmacklin      # Kapten Nykter: Barken Bortförklaringen
    b: navidmodiri        # Kapten Döver: Fregatten Fördärvet
    # oförrätt: Döver tjuvlyssnade på Nykters frieri till Barnsben (alla trodde han var döv) och upprepade det i tavernan
    status: done

  - id: 12
    type: one_way
    a: alexandrapalmquist # Kapten Babord: Galeonen Gnället
    b: ulrikahammar       # Kapten Barnsben: Korvetten Kurtisanen
    # oförrätt: Barnsben smög brev till Döver lindat i Babords scarf.
    # Dåtid. Ingen fysisk scarf på ön. Spelas som upprättelse, scen eller nytt brev.
    status: done

  - id: 13
    type: one_way
    a: ulrikahammar       # Kapten Barnsben: Korvetten Kurtisanen
    b: edvinthungren      # Kapten Rötägg: Galeonen Gnället
    # oförrätt: Rötäggets parfymspratt (blomster → rötägg) saboterade uppvaktning av Döver.
