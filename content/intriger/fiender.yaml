    status: done

  # --- Skäggtrion: Skäggens Konung, bygger vidare på #3 ---

  - id: 18
    type: mutual
    a: hampuslindblad     # Kapten Blåskägg: Barken Bortförklaringen
    b: viktoransund       # Kapten Rödskägg: Fregatten Fromheten
    # oförrätt: Båda vill kallas Skäggens Konung. Blåskägg bär blått av Galápagos-svamp och behandlar färgen som argument. Rödskägg tar det som förolämpning.
