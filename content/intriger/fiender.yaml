    status: done

  - id: 14
    type: one_way
    a: gustaftadaa        # Löjtnant Spader: Fregatten Fördärvet
    b: edvinthungren      # Kapten Rötägg: Galeonen Gnället
    # oförrätt: Rötägg fuskade i kort och vann Spaders sjökort till Plåthorns fiskegrund.
    # Gammal röta, innan omvändelsen. Dåtid. Inget fysiskt sjökort på ön.
    # Spelas som erkännande eller revansch vid ett nytt bord.
    status: done

  - id: 17
    type: one_way
    a: amandamungsgard    # Kapten Kosing: Fregatten Fromheten
    b: malintadaa         # Svarta Malin: Korvetten Kurtisanen
    # oförrätt: Malin skålade och kallade Kosings arvssyndsskatt (tax) tiggeri och kyrkkollekt.
    # Inte en rangordning mot Malins skatt (treasure). Kosing driver in skatt (tax)
